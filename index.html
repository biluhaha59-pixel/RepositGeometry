<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08091a" />
    <meta name="description" content="Protótipo gratuito, mobile-first e offline inspirado em Geometry Dash." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <title>Reposit Geometry</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="hud" aria-label="Informações do jogo">
        <div>
          <span class="label">Distância</span>
          <strong id="distance">0m</strong>
        </div>
        <div>
          <span class="label">Seed</span>
          <strong id="seedLabel">---</strong>
        </div>
        <div>
          <span class="label">BPM</span>
          <strong id="bpmLabel">120</strong>
        </div>
      </section>

      <canvas id="game" aria-label="Protótipo offline estilo Geometry Dash"></canvas>

      <section class="panel" id="panel">
        <h1>Reposit Geometry</h1>
        <p>
          Protótipo HTML gratuito, feito para celular e individual/offline. Publique no
          GitHub Pages e jogue pelo navegador do telefone, sem PC e sem pagar hospedagem.
        </p>
        <div class="actions">
          <button id="startBtn" type="button">Jogar</button>
          <button id="newSeedBtn" type="button" class="secondary">Nova fase</button>
        </div>
        <p class="hint">Toque na tela para pular. No celular, use “Adicionar à tela inicial” para abrir como app.</p>
      </section>
    </main>

    <script src="game.js" type="module"></script>
  </body>
</html>
